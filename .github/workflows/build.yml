name: Build Bazzite 45 images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate configuration
        run: |
          for script in build_files/*.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck build_files/build.sh scripts/*.sh
          jq -e '.fedora == 45 and (.images | length == 11) and ([.images[].name] | length == (unique | length)) and all(.images[]; (.name | test("^[a-z0-9-]+$")) and (.base | test("^ghcr.io/ublue-os/[a-z0-9-]+:stable-45$")))' images.json
      - name: Export image matrix
        id: matrix
        run: echo "images=$(jq -c '{include:.images}' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.matrix.outputs.images) }}
    env:
      IMAGE_NAME: ${{ matrix.name }}
      BASE_IMAGE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare image names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE_REGISTRY=ghcr.io/${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=45-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Validate signing key before building
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || { echo 'Missing SIGNING_SECRET repository secret'; exit 1; }
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cmp cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: Free build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Build image
        run: bash scripts/build-image.sh "$IMAGE_NAME"
      - name: Verify Fedora 45 and Brave Origin installation
        run: bash scripts/verify-image.sh "$IMAGE_NAME"
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image tags
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for tag in 45 stable-45 latest "$VERSION_TAG"; do
            for attempt in 1 2 3 4; do
              if podman push --digestfile "$RUNNER_TEMP/image-digest" \
                "localhost/$IMAGE_NAME:45" "$IMAGE_REGISTRY/$IMAGE_NAME:$tag"; then
                break
              fi
              test "$attempt" -lt 4 || exit 1
              sleep "$((attempt * 15))"
            done
          done
          echo "digest=$(cat "$RUNNER_TEMP/image-digest")" >> "$GITHUB_OUTPUT"
      - name: Sign and verify published image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if cosign sign -y --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST" && \
              cosign verify --key cosign.pub "$IMAGE_REGISTRY/$IMAGE_NAME@$DIGEST"; then
              exit 0
            fi
            test "$attempt" -lt 4 || exit 1
            sleep "$((attempt * 15))"
          done
